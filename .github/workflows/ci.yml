name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        # Build tags make each platform run its own test set: linux runs the
        # !darwin fixtures (net/swap/disk parse + counter-reset), macos runs
        # the darwin smoke tests — previously darwin code had zero CI cover.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -count=1 ./... 2>&1 | tee /tmp/gotest.log

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gotest-log-${{ matrix.os }}
          path: /tmp/gotest.log
          if-no-files-found: ignore
