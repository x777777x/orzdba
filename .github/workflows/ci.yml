name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      matrix:
        # Build tags make each platform run its own test set: linux runs the
        # !darwin fixtures (net/swap/disk parse + counter-reset), macos runs
        # the darwin smoke tests — previously darwin code had zero CI cover.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: go mod download
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -count=1 ./... 2>&1 | tee /tmp/gotest.log

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gotest-log-${{ matrix.os }}
          path: /tmp/gotest.log
          if-no-files-found: ignore

  # The project claims Windows/FreeBSD/BSD are compilable (system metrics
  # unimplemented there), but only the two runners above exercised their own
  # platform. A typo in a platform file (e.g. a windows stub) used to sail
  # through CI. Compile every CGO-free target here; darwin needs cgo and is
  # covered by the macos-latest job.
  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: go mod download
        run: go mod download

      - name: Cross-compile CGO-free targets
        run: |
          set -euo pipefail
          for t in linux/amd64 linux/arm64 linux/386 linux/arm \
                    freebsd/amd64 freebsd/arm64 \
                    windows/amd64 windows/arm64 windows/386; do
            os=${t%/*}; arch=${t#*/}
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build ./...
            echo "OK $t"
          done
